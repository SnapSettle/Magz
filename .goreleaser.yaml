version: 2
project_name: magz

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./main.go # Points to your main entrypoint file

archives:
  - format: tar.gz
    # Standard clean naming conventions for your release binaries
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none* # Prevents bundling clutter; isolates the binary

checksum:
  name_template: "checksums.txt"
