name: GoReleaser Action

on:
  push:
    tags:
      - '*' # Triggers automatically on tag push
  workflow_dispatch: # Unlocks the manual "Run workflow" button in GitHub UI

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases and uploading binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.5' # Matched directly to your go.mod target

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # --clean ensures old builds are wiped out
          # --snapshot lets you manually build binaries for testing without needing a fresh Git Tag
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
